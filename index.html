    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Early protection against Firebase Auth SDK internal assertion crashes in iframe / popup flows
      window.addEventListener('error', function(event) {
        var msg = String(event && (event.message || (event.error && event.error.message)) || '');
        var filename = String(event && event.filename || '');
        if (
          msg.indexOf('Pending promise was never set') !== -1 ||
          msg.indexOf('cancelled-popup-request') !== -1 ||
          msg.indexOf('popup-blocked') !== -1 ||
          msg.indexOf('popup-closed-by-user') !== -1 ||
          (msg.indexOf("Cannot read properties of null (reading 'style')") !== -1 && (filename.indexOf('recaptcha') !== -1 || filename.indexOf('gstatic') !== -1 || !filename)) ||
          msg.indexOf('recaptcha') !== -1
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          console.warn('[Handled Notice]', msg);
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = String(event && (event.reason && (event.reason.message || event.reason)) || '');
        var benignTokens = [
          'Pending promise was never set',
          'cancelled-popup-request',
          'popup-blocked',
          'popup-closed-by-user',
          'auth/popup-closed-by-user',
          'auth/cancelled-popup-request',
          'Missing or insufficient permissions',
          'permission-denied',
          'Failed to fetch',
          'NetworkError',
          'style',
          'recaptcha',
          'Firestore Error',
          '[Handled'
        ];
        var isBenign = benignTokens.some(function(t) { return reason.indexOf(t) !== -1; });
        if (isBenign) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          console.warn('[Handled Notice]', reason);
          return true;
        }
      });

      // Decode GitHub Pages SPA query redirect from 404.html
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Permanent invisible container for Firebase Phone Auth reCAPTCHA -->
    <div id="recaptcha-container"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
