<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>পাকুড়া সনাতন যুব সংঘ</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirection
      // This script takes the current URL path and redirects to index.html with query/hash
      // so client-side routing works seamlessly without 404 errors on refresh.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
